<title>Tauranga Harbour — tide light v2</title>
<style>
  :root{ --ink:#DEE9EB; --dim:#7E979E; --faint:#42585F; --line:#152429; --accent:#5FD0E8; }
  *{box-sizing:border-box;}
  body{margin:0;background:#03080B;color:var(--ink);
    font-family:ui-sans-serif,"Helvetica Neue",Helvetica,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1320px;margin:0 auto;padding:24px 18px 60px;}
  .eyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  h1{margin:6px 0 8px;font-size:clamp(20px,2.8vw,30px);font-weight:400;letter-spacing:-.01em;}
  h1 em{font-family:ui-serif,"Iowan Old Style","Times New Roman",serif;font-style:italic;}
  .sub{margin:0 0 18px;max-width:72ch;color:var(--dim);font-size:13.5px;line-height:1.6;}

  .stage{display:flex;justify-content:center;background:#010507;border-radius:3px;padding:14px;}
  .piece{position:relative;background:#02060A;overflow:hidden;box-shadow:0 22px 64px rgba(0,0,0,.75);
    max-width:100%;max-height:78vh;}
  canvas{display:block;width:100%;height:100%;}

  .plate{position:absolute;right:3.6%;top:5.5%;z-index:2;text-align:right;pointer-events:none;}
  .state{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .place{font-size:15px;color:#EAF3F5;margin-top:5px;font-weight:300;}
  .phase{font-size:12.5px;color:#A6BFC5;font-weight:300;}
  .rail{position:relative;width:150px;height:1px;background:rgba(190,225,232,.24);margin:13px 0 0 auto;}
  .rail i{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 10px 3px rgba(95,208,232,.6);}
  .meta{margin-top:12px;font-size:11.5px;color:#B7CCD1;font-weight:300;font-variant-numeric:tabular-nums;}
  .moonrow{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;}
  .moonrow span{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#8FA8AE;}

  .controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;}
  button,select{font:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:7px 11px;border-radius:2px;border:1px solid var(--line);background:#071318;color:var(--ink);cursor:pointer;}
  select{text-transform:none;letter-spacing:0;font-weight:400;}
  button:hover,select:hover{border-color:var(--accent);color:var(--accent);}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#03181D;}
  .spacer{flex:1;}

  .panel{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:20px 26px;}
  fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  legend{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;padding:0 0 4px;}
  label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);}
  label .v{font-variant-numeric:tabular-nums;color:var(--faint);font-size:10.5px;min-width:36px;text-align:right;}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:16px;margin:0;}
  input[type=color]{width:38px;height:20px;padding:0;border:1px solid var(--line);background:none;border-radius:2px;cursor:pointer;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--dim);}
  .note{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);
    line-height:1.65;max-width:80ch;}
  .note b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500;color:var(--accent);}
</style>

<div class="wrap">
  <div class="eyebrow">v2 · LINZ aerial · iOS frames · manual tide and light</div>
  <h1>Tauranga Harbour, <em>tide light</em></h1>
  <p class="sub">Pick a device frame, choose the imagery, and drive tide and daylight by hand or let
    them run live. Drag inside the frame to pan, scroll to zoom.</p>

  <div class="stage"><div class="piece" id="piece">
    <canvas id="c"></canvas>
    <div class="plate">
      <div class="state" id="state">RISING</div>
      <div class="place">Tauranga Harbour</div>
      <div class="phase" id="phase">Mid Tide</div>
      <div class="rail"><i id="dot"></i></div>
      <div class="meta" id="meta">—</div>
      <div class="moonrow"><span id="moontxt">—</span>
        <svg width="22" height="22" viewBox="-12 -12 24 24" aria-hidden="true">
          <circle r="10" fill="rgba(10,22,28,.7)" stroke="rgba(180,215,225,.3)" stroke-width="0.7"/>
          <path id="moonlit" d="" fill="#E2EFF3"/>
        </svg>
      </div>
    </div>
  </div></div>

  <div class="controls">
    <select id="device" title="Frame size"></select>
    <button id="land" aria-pressed="true">Landscape</button>
    <button id="port">Portrait</button>
    <span class="spacer"></span>
    <select id="basemap" title="Background imagery"></select>
    <select id="preset" title="Colour preset"></select>
    <button id="copy">Copy settings</button>
    <button id="reset">Reset</button>
  </div>

  <div class="controls">
    <button data-speed="1">Real time</button>
    <button data-speed="900">15 min / s</button>
    <button data-speed="2400" aria-pressed="true">40 min / s</button>
    <button data-speed="10800">3 hr / s</button>
    <span class="spacer"></span>
    <button id="liveAll">Back to live</button>
  </div>

  <div class="panel" id="panel"></div>

  <p class="note" id="resnote"></p>
</div>

<script type="module">
__TIDE_MODULE__

const IMAGES = __IMAGES__;              // {name: dataURI}
const FIELD_SRC = "__FIELD__";
const LATd=-37.65, LONd=176.17, RAD=Math.PI/180;
const GROUND_ASPECT=(0.38*110.95)/(0.44*111.320*Math.cos(37.6*RAD));
const LO=0.332, HI=2.127;

const DEVICES=[
  ['iPad 12.9" / 10.2"  4:3', 4/3],
  ['iPad Pro 11"  1.43:1', 2388/1668],
  ['iPad mini  1.50:1', 2266/1488],
  ['iPhone 15/16  19.5:9', 2556/1179],
  ['iPhone 8 / SE  16:9', 1334/750],
  ['Square  1:1', 1],
];
const PRESETS={
  'Bioluminescent':{shallow:'#6df3f7',mid:'#0b74a4',deep:'#03122e',landDark:'#0b1512',landLight:'#2c4029',
    flatDark:'#75786f',flatLight:'#f7f4e6',city:'#ffb545',edgeCol:'#c8ffff',dampCol:'#0d2a33',
    nightGlow:0.55,nightDepth:1.0,cityGain:1.9,edgeGain:0.38},
  'Deep water':{shallow:'#2ea9c4',mid:'#0a4f7e',deep:'#020a1c',landDark:'#080f0d',landLight:'#1e2c1c',
    flatDark:'#5c6058',flatLight:'#e8e4d2',city:'#ffc266',edgeCol:'#9fe8ff',dampCol:'#0a1e26',
    nightGlow:0.75,nightDepth:1.0,cityGain:2.3,edgeGain:0.30},
  'Warm chart':{shallow:'#ffd9a0',mid:'#c07a3e',deep:'#2a1a12',landDark:'#12100c',landLight:'#3a3524',
    flatDark:'#7a6b55',flatLight:'#fdf3dd',city:'#fff0c0',edgeCol:'#ffe6bb',dampCol:'#241a10',
    nightGlow:0.5,nightDepth:0.8,cityGain:1.6,edgeGain:0.34},
  'Monochrome':{shallow:'#dfe9ec',mid:'#6d7f87',deep:'#0b1114',landDark:'#0d1113',landLight:'#2a3134',
    flatDark:'#6c7276',flatLight:'#f2f4f5',city:'#ffd9a0',edgeCol:'#ffffff',dampCol:'#151b1e',
    nightGlow:0.6,nightDepth:1.0,cityGain:1.7,edgeGain:0.42},
};
const DEFAULTS={
  ...PRESETS['Bioluminescent'],
  zoom:0.50, cx:0.366, cy:0.46,
  depthCurve:1.15, moonGain:0.8, dampGain:1.0,
  exposure:1.0, gamma:0.92, vignette:0.30,
  tideManual:-1,          // <0 = follow the clock
  lightManual:-1,         // <0 = follow the sun
};
let S=JSON.parse(JSON.stringify(DEFAULTS));
let aspect=4/3, portrait=false, basemapName=Object.keys(IMAGES)[0];

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
function julian(d){return d.getTime()/86400000+2440587.5;}
function altitude(ra,dec,n){
  const lst=((((18.697374558+24.06570982441908*n)%24+24)%24)+LONd/15)%24*15*RAD;
  const H=lst-ra, lat=LATd*RAD;
  return Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H))/RAD;
}
function sunPos(d){const n=julian(d)-2451545.0;
  const L=(280.460+0.9856474*n)*RAD,g=(357.528+0.9856003*n)*RAD;
  const lam=L+1.915*RAD*Math.sin(g)+0.020*RAD*Math.sin(2*g),eps=23.439*RAD;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  return {alt:altitude(ra,dec,n),lam};}
function moonPos(d){const n=julian(d)-2451545.0;
  const L=(218.316+13.176396*n)*RAD,M=(134.963+13.064993*n)*RAD,F=(93.272+13.229350*n)*RAD;
  const lam=L+6.289*RAD*Math.sin(M),beta=5.128*RAD*Math.sin(F),eps=23.439*RAD;
  const dec=Math.asin(Math.sin(beta)*Math.cos(eps)+Math.cos(beta)*Math.sin(eps)*Math.sin(lam));
  const ra=Math.atan2(Math.sin(lam)*Math.cos(eps)-Math.tan(beta)*Math.sin(eps),Math.cos(lam));
  const s=sunPos(d),el=Math.acos(Math.cos(beta)*Math.cos(lam-s.lam));
  return {alt:altitude(ra,dec,n),frac:(1-Math.cos(el))/2,waxing:((((lam-s.lam)/RAD)%360+360)%360)<180};}

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false});
if(!gl){document.getElementById('piece').innerHTML='<p style="padding:26px;color:#7E979E">Needs WebGL.</p>';throw new Error('no webgl');}
gl.getExtension('OES_standard_derivatives');

const VS=`attribute vec2 p; varying vec2 vUv;
void main(){ vUv=vec2(p.x*0.5+0.5,0.5-p.y*0.5); gl_Position=vec4(p,0.0,1.0); }`;
const FS=`#extension GL_OES_standard_derivatives : enable
precision highp float;
varying vec2 vUv;
uniform sampler2D uBase,uFieldL,uFieldN;
uniform vec2 uCenter; uniform float uZoom,uFrameAspect;
uniform float uTide,uTidePast,uDay,uMoon,uNightMix;
uniform vec3 uSunTint,uShallow,uMid,uDeep,uLandDark,uLandLight,uFlatDark,uFlatLight,uCity,uEdgeCol,uDampCol;
uniform float uDepthCurve,uNightDepth,uNightGlow,uCityGain,uEdgeGain,uDampGain,uExposure,uGamma,uVignette;

void main(){
  vec2 uv=uCenter+vec2((vUv.x-0.5)*uZoom*uFrameAspect*1.0866,(vUv.y-0.5)*uZoom);
  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){gl_FragColor=vec4(0.0,0.0,0.0,1.0);return;}
  vec3 base=texture2D(uBase,uv).rgb;
  float dryH=texture2D(uFieldL,uv).r*2.5;
  vec4 fN=texture2D(uFieldN,uv);
  float cls=fN.g, city=fN.b, lum=dot(base,vec3(0.299,0.587,0.114));

  float isSub=1.0-step(0.25,cls), isInter=step(0.25,cls)*(1.0-step(0.75,cls));
  float submerged=isSub+isInter*step(dryH,uTide);

  vec3 land=mix(uLandDark,uLandLight,smoothstep(0.03,0.50,lum));
  vec3 flat0=mix(uFlatDark,uFlatLight,smoothstep(0.03,0.44,lum));
  float ebb=step(uTide+0.0004,uTidePast);
  float band=ebb*step(uTide,dryH)*step(dryH,uTidePast);
  float wet=clamp(band*(1.0-(dryH-uTide)/max(uTidePast-uTide,1e-4))*uDampGain,0.0,1.0);
  flat0=mix(flat0,flat0*0.38+uDampCol,wet);

  float depth=mix(clamp((uTide-dryH)/uDepthCurve,0.0,1.0),1.0-smoothstep(0.03,0.34,lum),isSub);
  vec3 water=depth<0.5?mix(uShallow,uMid,depth*2.0):mix(uMid,uDeep,(depth-0.5)*2.0);
  water*=0.86+0.30*lum;

  float edge=0.0;
  if(isInter>0.5){ float we=max(fwidth(dryH),0.0005); edge=1.0-smoothstep(0.0,we*2.2,abs(dryH-uTide)); }

  vec3 surface=mix(mix(land,flat0,isInter),water,submerged);
  vec3 daylight=surface*uSunTint*uDay;
  float dnight=mix(1.0,depth,uNightDepth);
  float emis=submerged*dnight*uNightGlow*(0.25+0.75*uMoon);
  vec3 night=surface*(0.04+0.26*uMoon)+water*emis;
  vec3 col=mix(daylight,night,uNightMix);
  col+=uCity*city*uCityGain*uNightMix;
  col+=uEdgeCol*edge*uEdgeGain*(0.6+0.6*uNightMix);
  col*=uExposure;
  col*=1.0-uVignette*smoothstep(0.42,0.98,distance(vUv,vec2(0.5)));
  gl_FragColor=vec4(pow(clamp(col,0.0,1.0),vec3(uGamma)),1.0);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(prog,n);
function mkTex(img,unit,smooth){
  const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=smooth?gl.LINEAR:gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
  return t;
}
const load=s=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=s;});

function drawMoon(frac,waxing){
  const R=10,k=Math.max(0,Math.min(1,frac)),x=R*(1-2*k);
  const so=waxing?1:0,si=(x>=0)===waxing?0:1;
  document.getElementById('moonlit').setAttribute('d',
    k<0.01?'':`M 0 ${-R} A ${R} ${R} 0 0 ${so} 0 ${R} A ${Math.abs(x)} ${R} 0 0 ${si} 0 ${-R} Z`);
}

// ---------------- UI ----------------
const GROUPS=[
  ['Drive it by hand',[['tideManual','Tide height (m)',-1,HI,0.005,'live below 0.33'],
                       ['lightManual','Daylight',-1,1,0.005,'live below 0']]],
  ['Framing',[['zoom','Zoom',0.18,1.0,0.005],['cx','Centre ←→',0,1,0.005],['cy','Centre ↑↓',0,1,0.005]]],
  ['Water',[['shallow','Shallow','c'],['mid','Mid','c'],['deep','Deep','c'],['depthCurve','Depth falloff',0.4,2.5,0.01]]],
  ['Night',[['nightGlow','Water glow',0,1.6,0.01],['nightDepth','Glow follows depth',0,1,0.01],['moonGain','Moon influence',0,1.5,0.01]]],
  ['Towns',[['city','Light colour','c'],['cityGain','Brightness',0,5,0.05]]],
  ['Waterline',[['edgeCol','Colour','c'],['edgeGain','Glow',0,1.5,0.01]]],
  ['Ground',[['landDark','Land dark','c'],['landLight','Land light','c'],['flatDark','Flat dark','c'],
             ['flatLight','Flat light','c'],['dampCol','Damp tint','c'],['dampGain','Damp strength',0,2,0.02]]],
  ['Image',[['exposure','Exposure',0.4,2,0.01],['gamma','Gamma',0.6,1.4,0.01],['vignette','Vignette',0,0.8,0.01]]],
];
const panel=document.getElementById('panel');
for(const [title,items] of GROUPS){
  const fsx=document.createElement('fieldset');
  fsx.innerHTML=`<legend>${title}</legend>`;
  for(const [key,label,a,b,step] of items){
    if(a==='c'){
      const row=document.createElement('div');row.className='row';row.innerHTML=`<span>${label}</span>`;
      const inp=document.createElement('input');inp.type='color';inp.value=S[key];inp.dataset.key=key;
      inp.addEventListener('input',()=>S[key]=inp.value);row.appendChild(inp);fsx.appendChild(row);
    }else{
      const lb=document.createElement('label');
      lb.innerHTML=`<span>${label}</span><span class="v" id="v_${key}"></span>`;
      const inp=document.createElement('input');
      inp.type='range';inp.min=a;inp.max=b;inp.step=step;inp.value=S[key];inp.dataset.key=key;
      inp.addEventListener('input',()=>{S[key]=+inp.value;showVal(key);});
      lb.appendChild(inp);fsx.appendChild(lb);
    }
  }
  panel.appendChild(fsx);
}
function showVal(k){
  const el=document.getElementById('v_'+k); if(!el) return;
  if(k==='tideManual') el.textContent = S[k]<LO ? 'live' : S[k].toFixed(2);
  else if(k==='lightManual') el.textContent = S[k]<0 ? 'live' : S[k].toFixed(2);
  else el.textContent=(+S[k]).toFixed(2);
}
function syncInputs(){
  panel.querySelectorAll('input').forEach(i=>{const k=i.dataset.key;if(k!=null){i.value=S[k];showVal(k);}});
}
syncInputs();

const devSel=document.getElementById('device');
DEVICES.forEach(([n,a],i)=>{const o=document.createElement('option');o.value=a;o.textContent=n;if(i===0)o.selected=true;devSel.appendChild(o);});
const baseSel=document.getElementById('basemap');
Object.keys(IMAGES).forEach((n,i)=>{const o=document.createElement('option');o.value=n;o.textContent=n;if(i===0)o.selected=true;baseSel.appendChild(o);});
const preSel=document.getElementById('preset');
{const o=document.createElement('option');o.textContent='Colour preset…';o.value='';preSel.appendChild(o);}
Object.keys(PRESETS).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;preSel.appendChild(o);});
preSel.addEventListener('change',()=>{const p=PRESETS[preSel.value];if(p){Object.assign(S,JSON.parse(JSON.stringify(p)));syncInputs();}});

const piece=document.getElementById('piece');
function applyFrame(){
  const a=portrait?1/aspect:aspect;
  const maxW=Math.min(piece.parentElement.clientWidth-28,1180);
  const maxH=Math.round(window.innerHeight*0.78);
  let w=maxW,h=w/a; if(h>maxH){h=maxH;w=h*a;}
  piece.style.width=Math.round(w)+'px';piece.style.height=Math.round(h)+'px';
  canvas.width=Math.min(2600,Math.round(w*2));canvas.height=Math.round(canvas.width/a);
  gl.viewport(0,0,canvas.width,canvas.height);
}
devSel.addEventListener('change',()=>{aspect=+devSel.value;applyFrame();});
const bl=document.getElementById('land'),bp=document.getElementById('port');
bl.addEventListener('click',()=>{portrait=false;bl.setAttribute('aria-pressed','true');bp.setAttribute('aria-pressed','false');applyFrame();});
bp.addEventListener('click',()=>{portrait=true;bp.setAttribute('aria-pressed','true');bl.setAttribute('aria-pressed','false');applyFrame();});
window.addEventListener('resize',applyFrame);

let drag=null;
piece.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:S.cx,cy:S.cy};piece.setPointerCapture(e.pointerId);});
piece.addEventListener('pointermove',e=>{if(!drag)return;const r=piece.getBoundingClientRect();
  const a=portrait?1/aspect:aspect;
  S.cx=Math.max(0,Math.min(1,drag.cx-(e.clientX-drag.x)/r.width*S.zoom*a*1.0866));
  S.cy=Math.max(0,Math.min(1,drag.cy-(e.clientY-drag.y)/r.height*S.zoom));syncInputs();});
piece.addEventListener('pointerup',()=>drag=null);
piece.addEventListener('wheel',e=>{e.preventDefault();
  S.zoom=Math.max(0.18,Math.min(1,S.zoom*(1+Math.sign(e.deltaY)*0.06)));syncInputs();},{passive:false});

document.getElementById('reset').addEventListener('click',()=>{S=JSON.parse(JSON.stringify(DEFAULTS));syncInputs();});
document.getElementById('liveAll').addEventListener('click',()=>{S.tideManual=-1;S.lightManual=-1;virtual=new Date();syncInputs();});
document.getElementById('copy').addEventListener('click',async e=>{
  try{await navigator.clipboard.writeText(JSON.stringify({...S,basemap:basemapName,aspect:portrait?1/aspect:aspect},null,2));e.target.textContent='Copied';}
  catch{e.target.textContent='Copy failed';}
  setTimeout(()=>e.target.textContent='Copy settings',1400);});

// ---------------- loop ----------------
const DAMP_MIN=110;
let virtual=new Date(),speed=2400,last=performance.now();
const tF=new Intl.DateTimeFormat('en-NZ',{timeZone:'Pacific/Auckland',hour:'numeric',minute:'2-digit',hour12:true});
const dF=new Intl.DateTimeFormat('en-NZ',{timeZone:'Pacific/Auckland',weekday:'short',day:'numeric',month:'short'});
function stateWord(h,rising){const f=(h-LO)/(HI-LO);
  if(f<0.14)return'Low Tide';if(f>0.86)return'High Tide';
  if(f>0.40&&f<0.60)return'Mid Tide';return rising?'Flooding':'Draining';}

function frame(now){
  const dt=(now-last)/1000;last=now;
  virtual=new Date(virtual.getTime()+dt*speed*1000);
  const manualTide=S.tideManual>=LO;
  const hTrue=manualTide?S.tideManual:predict(virtual);
  const h=Math.max(LO,Math.min(HI,hTrue));
  const hPast=manualTide?h:Math.max(LO,Math.min(HI,predict(new Date(virtual.getTime()-DAMP_MIN*60000))));
  const rising=manualTide?true:hTrue>predict(new Date(virtual.getTime()-600000));
  const sun=sunPos(virtual),moon=moonPos(virtual);
  const day=S.lightManual>=0?S.lightManual:Math.max(0,Math.min(1,(sun.alt+6)/11));
  const warm=Math.max(0,Math.min(1,(12-sun.alt)/18));
  const inten=S.lightManual>=0?1:0.30+0.70*Math.max(0,Math.min(1,(sun.alt+4)/26));
  const moonUp=Math.max(0,Math.min(1,(moon.alt+2)/16));
  const moonLight=Math.min(1,moon.frac*moonUp*S.moonGain);

  const a=portrait?1/aspect:aspect;
  const halfW=S.zoom*a*1.0866/2,halfH=S.zoom/2;
  gl.uniform2f(U('uCenter'),Math.max(halfW,Math.min(1-halfW,S.cx)),Math.max(halfH,Math.min(1-halfH,S.cy)));
  gl.uniform1f(U('uZoom'),S.zoom);gl.uniform1f(U('uFrameAspect'),a);
  gl.uniform1f(U('uTide'),h);gl.uniform1f(U('uTidePast'),hPast);
  gl.uniform1f(U('uDay'),day*inten);gl.uniform1f(U('uMoon'),moonLight);gl.uniform1f(U('uNightMix'),1-day);
  gl.uniform3f(U('uSunTint'),1+0.30*warm,1-0.05*warm,1-0.34*warm);
  for(const [k,n] of [['shallow','uShallow'],['mid','uMid'],['deep','uDeep'],['landDark','uLandDark'],
      ['landLight','uLandLight'],['flatDark','uFlatDark'],['flatLight','uFlatLight'],['city','uCity'],
      ['edgeCol','uEdgeCol'],['dampCol','uDampCol']]){
    const c=hex2rgb(S[k]);gl.uniform3f(U(n),c[0],c[1],c[2]);}
  for(const [k,n] of [['depthCurve','uDepthCurve'],['nightDepth','uNightDepth'],['nightGlow','uNightGlow'],
      ['cityGain','uCityGain'],['edgeGain','uEdgeGain'],['dampGain','uDampGain'],
      ['exposure','uExposure'],['gamma','uGamma'],['vignette','uVignette']]) gl.uniform1f(U(n),S[k]);
  gl.drawArrays(gl.TRIANGLES,0,3);

  document.getElementById('state').textContent=manualTide?'HELD':(rising?'RISING':'FALLING');
  document.getElementById('phase').textContent=stateWord(h,rising);
  document.getElementById('dot').style.left=((h-LO)/(HI-LO)*100)+'%';
  document.getElementById('meta').textContent=
    (manualTide?'—  ·  ':tF.format(virtual).toUpperCase()+'  ·  '+dF.format(virtual)+'  ·  ')+hTrue.toFixed(2)+' m';
  document.getElementById('moontxt').textContent=Math.round(moon.frac*100)+'% '+(moon.waxing?'waxing':'waning');
  drawMoon(moon.frac,moon.waxing);
  requestAnimationFrame(frame);
}
const sB=[...document.querySelectorAll('[data-speed]')];
sB.forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.speed;sB.forEach(o=>o.setAttribute('aria-pressed',String(o===b)));}));

// ---------------- boot ----------------
const imgs={};
for(const [name,src] of Object.entries(IMAGES)) imgs[name]=await load(src);
const fieldImg=await load(FIELD_SRC);
mkTex(imgs[basemapName],0,true);
mkTex(fieldImg,1,true);
mkTex(fieldImg,2,false);
gl.uniform1i(U('uBase'),0);gl.uniform1i(U('uFieldL'),1);gl.uniform1i(U('uFieldN'),2);
baseSel.addEventListener('change',()=>{basemapName=baseSel.value;mkTex(imgs[basemapName],0,true);updateNote();});
function updateNote(){
  const w=imgs[basemapName].width;
  const mpp=(0.44*111320*Math.cos(37.6*Math.PI/180)/w).toFixed(1);
  document.getElementById('resnote').innerHTML=
    `<b>${basemapName}</b> — ${w}px across the harbour, about <b>${mpp} m</b> per pixel here. `+
    `The LINZ layer is genuinely <b>0.1 m</b> at source; it is downsampled to fit an embeddable page, `+
    `and at whole-harbour framing an iPad screen cannot resolve more than this anyway. `+
    `Zoom in and the difference against Sentinel-2 shows. The waterline itself is limited to `+
    `<b>~15 m</b> by the drying-height raster, whatever the imagery does.`;
}
applyFrame(); updateNote();
// debug hook: lets a headless/hidden pane drive one frame, where rAF is suspended
window.__tick = t => frame(t ?? performance.now());
window.__pixel = (x,y) => { const p=new Uint8Array(4); gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p); return [...p]; };
requestAnimationFrame(frame);
</script>
